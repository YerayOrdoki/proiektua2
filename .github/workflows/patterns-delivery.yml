name: Patterns delivery
on:
  workflow_dispatch:
  push:
    branches: [patroiak-proiektua26]
    paths:
      - 'src/**'
      - 'tools/build-patterns-docs.py'
      - 'doc/patterns/*.puml'
      - 'doc/patterns/README.md'
      - '.github/workflows/patterns-delivery.yml'
permissions:
  contents: write
concurrency:
  group: patterns-delivery
  cancel-in-progress: false
jobs:
  verify-and-document:
    if: github.ref == 'refs/heads/patroiak-proiektua26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb plantuml graphviz
          python -m pip install reportlab python-docx
      - name: Compile and execute Java tests and real screenshot examples
        run: xvfb-run -a -s '-screen 0 1280x1024x24' mvn -B test -Dtest=PatternsTest,PatternsScreenshotTest
      - name: Render complete UML diagrams
        run: |
          plantuml -charset UTF-8 -tpng doc/patterns/factory.puml
          plantuml -charset UTF-8 -tpng -o uml doc/patterns/iterator.puml doc/patterns/adapter.puml
          cp doc/patterns/uml/iterator.png doc/patterns/iterator-uml.png
          cp doc/patterns/uml/adapter.png doc/patterns/adapter-uml.png
          rm -rf doc/patterns/uml
      - name: Check Surefire XML and generate PDF and Word only if validation succeeds
        run: python tools/build-patterns-docs.py
      - name: Save generated documents and evidence to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patters.pdf doc/patterns/patroiak.docx doc/patterns/factory.png doc/patterns/iterator-uml.png doc/patterns/adapter-uml.png doc/patterns/adapter.png doc/patterns/iterator.png doc/patterns/iterator-output.txt doc/patterns/validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: generated UML, verified execution captures, PDF and Word [skip ci]'
            git push origin HEAD:patroiak-proiektua26
          fi
      - name: Preserve reports and delivery even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patterns-delivery
          path: |
            target/surefire-reports/
            patters.pdf
            doc/patterns/
